<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Sharing is Caring: four steps from a folder of photos to one mail per person</title>
  <desc id="d">Import photos and the participant list, tag who is on which picture, write one template, then send one mail per person via share sheet, mailto, .eml or ZIP. Everything runs in the browser.</desc>
  <style>
    .card { fill: #ffffff; stroke: #DCE1EB; stroke-width: 1.5; }
    .num { fill: #4F46E5; }
    .numt { fill: #ffffff; font: 700 15px -apple-system, "Segoe UI", Inter, Arial, sans-serif; }
    .h { fill: #151A2D; font: 600 19px -apple-system, "Segoe UI", Inter, Arial, sans-serif; }
    .p { fill: #4A5168; font: 400 14px -apple-system, "Segoe UI", Inter, Arial, sans-serif; }
    .arrow { stroke: #8A91A6; stroke-width: 2; fill: none; }
    .band { fill: #E9E8FF; }
    .bandt { fill: #4338CA; font: 600 14px -apple-system, "Segoe UI", Inter, Arial, sans-serif; letter-spacing: .02em; }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A91A6"/>
    </marker>
  </defs>
  <g transform="translate(20 24)">
    <rect class="card" x="0" y="0" width="262" height="210" rx="12"/>
    <rect class="num" x="18" y="18" width="28" height="28" rx="8"/><text class="numt" x="32" y="37.5" text-anchor="middle">1</text>
    <text class="h" x="58" y="38">Import</text>
    <text class="p" x="18" y="80">Photos from the event and</text>
    <text class="p" x="18" y="100">the participant list as CSV.</text>
    <text class="p" x="18" y="134">Stored in the browser only.</text>
    <text class="p" x="18" y="154">Nothing is uploaded.</text>
  </g>
  <g transform="translate(312 24)">
    <rect class="card" x="0" y="0" width="262" height="210" rx="12"/>
    <rect class="num" x="18" y="18" width="28" height="28" rx="8"/><text class="numt" x="32" y="37.5" text-anchor="middle">2</text>
    <text class="h" x="58" y="38">Tag</text>
    <text class="p" x="18" y="80">Type a name, press Enter,</text>
    <text class="p" x="18" y="100">next photo.</text>
    <text class="p" x="18" y="134">Group shot: one click</text>
    <text class="p" x="18" y="154">tags everyone.</text>
  </g>
  <g transform="translate(604 24)">
    <rect class="card" x="0" y="0" width="262" height="210" rx="12"/>
    <rect class="num" x="18" y="18" width="28" height="28" rx="8"/><text class="numt" x="32" y="37.5" text-anchor="middle">3</text>
    <text class="h" x="58" y="38">Write once</text>
    <text class="p" x="18" y="80">One template for the mail</text>
    <text class="p" x="18" y="100">and the LinkedIn post.</text>
    <text class="p" x="18" y="134">Placeholders fill in per</text>
    <text class="p" x="18" y="154">person, with live preview.</text>
  </g>
  <g transform="translate(896 24)">
    <rect class="card" x="0" y="0" width="284" height="210" rx="12"/>
    <rect class="num" x="18" y="18" width="28" height="28" rx="8"/><text class="numt" x="32" y="37.5" text-anchor="middle">4</text>
    <text class="h" x="58" y="38">Send, one by one</text>
    <text class="p" x="18" y="80">Share sheet with photos,</text>
    <text class="p" x="18" y="100">mailto draft, .eml with the</text>
    <text class="p" x="18" y="120">post card, or a ZIP of all.</text>
    <text class="p" x="18" y="154">You read, you send.</text>
  </g>
  <path class="arrow" d="M284 129 L310 129" marker-end="url(#m)"/>
  <path class="arrow" d="M576 129 L602 129" marker-end="url(#m)"/>
  <path class="arrow" d="M868 129 L894 129" marker-end="url(#m)"/>
  <rect class="band" x="20" y="262" width="1160" height="44" rx="10"/>
  <text class="bandt" x="600" y="289" text-anchor="middle">STATIC PAGE · NO BACKEND · NO ACCOUNT · PHOTOS AND NAMES NEVER LEAVE THE BROWSER</text>
</svg>
