name: Problem or documentation correction
description: Report a reproducible problem, unclear instruction or unsupported claim.
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: Name the step (Import, Markieren, Texte, Export) or the document. Do not include real names, addresses or photos.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or evidence
      description: Smallest reproduction, ideally with the example data ("Mit Beispiel ausprobieren"), or the exact wording for a documentation concern.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and mail client
      placeholder: e.g. Chrome 131 on Windows 11, new Outlook; or Safari on macOS, Apple Mail
